<div class="field {% if field.name == 'name' %}field-wide{% endif %} {{ extra_class }}">
  {% if field.field.widget.input_type == "checkbox" %}<label class="check-field">{{ field }}<span>{{ field.label }}</span></label>
  {% else %}<label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="required">*</span>{% endif %}</label>{{ field }}{% endif %}
  {% if field.help_text %}<span class="help-text">{{ field.help_text }}</span>{% endif %}
  {% for error in field.errors %}<span class="field-error">{{ error }}</span>{% endfor %}
</div>
