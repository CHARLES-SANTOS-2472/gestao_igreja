services:
  - type: web
    name: gestao-igreja
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    healthCheckPath: /entrar/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: SSL_REDIRECT
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: gestao-igreja-db
          property: connectionString

databases:
  - name: gestao-igreja-db
    plan: free
